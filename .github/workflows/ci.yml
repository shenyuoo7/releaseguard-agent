name: releaseguard-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Mypy
        run: python -m mypy src/releaseguard_agent
      - name: Unit tests
        run: python -m pytest -p no:cacheprovider tests/unit
      - name: Integration tests
        run: python -m pytest -p no:cacheprovider tests/integration
      - name: E2E tests
        run: python -m pytest -p no:cacheprovider tests/e2e
      - name: Offline evaluation
        run: python -m releaseguard_agent.cli.main evaluate

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Build local demo image
        run: docker build --tag releaseguard-agent:ci .
      - name: Start container
        run: docker run --detach --name releaseguard-ci --publish 8000:8000 releaseguard-agent:ci
      - name: Check API health
        run: python scripts/http_health_smoke.py --url http://127.0.0.1:8000/health
      - name: Show container logs after failure
        if: failure()
        run: docker logs releaseguard-ci
      - name: Stop container
        if: always()
        run: docker rm --force releaseguard-ci
